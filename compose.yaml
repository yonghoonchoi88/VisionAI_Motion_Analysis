# Vision AI 동작 분석 서비스 — 5개 서비스
#   django   : 화면·DRF API·회원·ORM            (backend/Dockerfile)
#   celery   : 비동기 분석 작업 실행             (backend/Dockerfile 같은 이미지, 실행 명령만 다름)
#   fastapi  : YOLO Pose + Random Forest 추론   (ai_service/Dockerfile)
#   redis    : Celery 작업 대기열
#   postgres : 영구 DB (사용자·분석 작업·사람별 예측)
#
# 실행:  docker compose up --build
# 서비스끼리는 localhost가 아니라 '서비스 이름'(postgres, redis, fastapi)으로 통신한다.

name: vision-action-platform

x-backend-env: &backend-env
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  CELERY_TASK_ALWAYS_EAGER: "0"
  FASTAPI_URL: http://fastapi:8001
  MEDIA_ROOT: /app/media

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vision_action}
      POSTGRES_USER: ${POSTGRES_USER:-vision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env에 POSTGRES_PASSWORD를 설정하세요}
    volumes:
      - postgres_data:/var/lib/postgresql/data       # 컨테이너를 지워도 DB 유지
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"                                  # 로컬 개발(Docker 없이 Django 실행) 시 접속용
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"                                  # 로컬 개발 시 Celery Worker 접속용
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  fastapi:
    build: ./ai_service
    environment:
      POSE_DEVICE: ${POSE_DEVICE:-cpu}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-200}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUIRE_MODEL_CHECKSUM: ${REQUIRE_MODEL_CHECKSUM:-0}   # 1이면 SHA256SUMS.txt 없이는 모델을 열지 않음
      MIN_CONFIDENCE: ${MIN_CONFIDENCE:-}                    # 비우면 project.json의 decision 값 사용
      MIN_MARGIN: ${MIN_MARGIN:-}
    volumes:
      - ./ai_service/models:/app/models:ro           # joblib·pt는 Git에 없으므로 로컬 파일을 읽기 전용으로 연결
    ports:
      - "${FASTAPI_HOST_PORT:-8001}:8001"                                  # 개발용: /docs 확인. 운영에서는 제거 가능 (django·celery는 내부망으로 접근)
    healthcheck:
      test: ["CMD", "python", "-c", "import json,sys,urllib.request; sys.exit(0 if json.load(urllib.request.urlopen('http://localhost:8001/health'))['model_ready'] else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s                              # YOLO 로드·Warm-up 시간
    restart: unless-stopped

  django:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment: *backend-env
    volumes:
      - media_data:/app/media                        # 업로드·수집 영상 (celery와 공유)
    ports:
      - "${DJANGO_HOST_PORT:-8000}:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  celery:
    build: ./backend
    command: celery -A config worker --loglevel=INFO --concurrency=1
    env_file: .env
    environment: *backend-env
    volumes:
      - media_data:/app/media                        # django가 저장한 업로드 파일을 같은 경로로 읽음
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      fastapi: { condition: service_healthy }
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
