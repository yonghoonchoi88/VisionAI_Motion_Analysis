{% extends "base.html" %}
{% block title %}비밀번호 변경 · Vision AI{% endblock %}
{% block content %}
<section class="auth card">
  <h1 class="card__title">비밀번호 변경</h1>
  <form method="post" class="form" novalidate>
    {% csrf_token %}
    {% for field in form %}
      <label class="field{% if field.errors %} field--error{% endif %}">
        <span>{{ field.label }}</span>
        {{ field }}
        {% for e in field.errors %}<small class="error">{{ e }}</small>{% endfor %}
      </label>
    {% endfor %}
    <button class="btn btn--block">변경하기</button>
  </form>
  <p class="muted center"><a href="{% url 'profile' %}">← 내 정보</a></p>
</section>
{% endblock %}
