{% extends "base.html" %}
{% block title %}로그인 · Vision AI{% endblock %}
{% block content %}
<section class="auth card">
  <h1 class="card__title">로그인</h1>
  <p class="muted">분석을 요청하려면 로그인하세요.</p>
  <form method="post" class="form">
    {% csrf_token %}
    {% if form.non_field_errors %}<div class="alert alert--error">아이디 또는 비밀번호가 올바르지 않습니다.</div>{% endif %}
    <label class="field"><span>아이디</span>{{ form.username }}</label>
    <label class="field"><span>비밀번호</span>{{ form.password }}</label>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn btn--block">로그인</button>
  </form>
  <p class="muted center">계정이 없나요? <a href="{% url 'signup' %}">회원가입</a></p>
</section>
{% endblock %}
